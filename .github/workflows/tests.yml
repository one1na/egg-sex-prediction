# 每次推送到 GitHub，自动在 Linux 和 Windows 上各跑一遍单元测试。
# 想同时跑完整验收测试：在 GitHub 的 Actions 页面选“测试”，点 Run workflow，勾选那一项。
name: 测试

on:
  push:
  workflow_dispatch:
    inputs:
      acceptance:
        description: 同时跑完整验收测试（不替换发布门控、按正式设置跑整条链，多花几分钟）
        type: boolean
        default: false

concurrency:                    # 同一分支连续推送时，只跑最新的一次
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false          # 一个系统没通过，另一个照样跑完
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONIOENCODING: utf-8   # 和窗口界面、网页界面启动子程序时的设置一样
    defaults:
      run:
        shell: bash
        working-directory: code
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: code/requirements.txt
      - name: 安装依赖（版本按 requirements.txt 锁定；torch 装 CPU 版，省掉几 GB 的 GPU 组件）
        run: |
          torch=$(tr -d '\r' < requirements.txt | awk '/^torch==/ {print $1}')
          test -n "$torch"
          python -m pip install "$torch" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: 单元测试
        run: python -m unittest discover -s tests -v
      - name: 完整验收测试
        if: github.event_name == 'workflow_dispatch' && inputs.acceptance
        run: python -m unittest discover -s acceptance -v
